<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Course catalog — ER diagram (Lab 6)</title>
<desc id="desc">Courses and students each have zero or more enrollments. Each enrollment references exactly one course and one student.</desc>
<rect width="1200" height="650" fill="#f8fafc"/>
<style>text{font-family:Arial,sans-serif;fill:#172033}.heading{font-size:26px;font-weight:700}.table{font-size:20px;font-weight:700;fill:white}.field{font-size:16px}.note{font-size:15px;fill:#475569}.line{fill:none;stroke:#64748b;stroke-width:2}</style>
<text x="50" y="50" class="heading">Course catalog · ER diagram</text>
<text x="50" y="78" class="note">Lab 6 · PostgreSQL · schema.sql</text>

<rect x="50" y="130" width="440" height="258" rx="10" fill="white" stroke="#cbd5e1"/>
<path d="M60 130 H480 Q490 130 490 140 V174 H50 V140 Q50 130 60 130" fill="#2449a8"/>
<text x="68" y="159" class="table">courses</text>
<text x="66" y="199" class="field">id</text><text x="340" y="199" class="note">text</text><text x="450" y="199" class="note">PK</text>
<text x="66" y="233" class="field">title</text><text x="340" y="233" class="note">text</text><text x="450" y="233" class="note"></text>
<text x="66" y="267" class="field">description</text><text x="340" y="267" class="note">text</text><text x="450" y="267" class="note"></text>
<text x="66" y="301" class="field">credits</text><text x="340" y="301" class="note">integer</text><text x="450" y="301" class="note"></text>
<text x="66" y="335" class="field">is_elective</text><text x="340" y="335" class="note">boolean</text><text x="450" y="335" class="note"></text>
<text x="66" y="369" class="field">likes</text><text x="340" y="369" class="note">integer</text><text x="450" y="369" class="note"></text>
<rect x="710" y="130" width="440" height="156" rx="10" fill="white" stroke="#cbd5e1"/>
<path d="M720 130 H1140 Q1150 130 1150 140 V174 H710 V140 Q710 130 720 130" fill="#2449a8"/>
<text x="728" y="159" class="table">students</text>
<text x="726" y="199" class="field">id</text><text x="1000" y="199" class="note">bigint</text><text x="1110" y="199" class="note">PK</text>
<text x="726" y="233" class="field">name</text><text x="1000" y="233" class="note">text</text><text x="1110" y="233" class="note"></text>
<text x="726" y="267" class="field">email</text><text x="1000" y="267" class="note">text</text><text x="1110" y="267" class="note">UK</text>
<rect x="380" y="390" width="440" height="190" rx="10" fill="white" stroke="#cbd5e1"/>
<path d="M390 390 H810 Q820 390 820 400 V434 H380 V400 Q380 390 390 390" fill="#2449a8"/>
<text x="398" y="419" class="table">enrollments</text>
<text x="396" y="459" class="field">id</text><text x="670" y="459" class="note">bigint</text><text x="780" y="459" class="note">PK</text>
<text x="396" y="493" class="field">course_id</text><text x="670" y="493" class="note">text</text><text x="780" y="493" class="note">FK</text>
<text x="396" y="527" class="field">student_id</text><text x="670" y="527" class="note">bigint</text><text x="780" y="527" class="note">FK</text>
<text x="396" y="561" class="field">enrolled_at</text><text x="670" y="561" class="note">timestamptz</text><text x="780" y="561" class="note"></text>
<path class="line" d="M270 388 V435 H380 M930 286 V469 H820"/>
<text x="278" y="411" class="note">1</text><text x="335" y="426" class="note">0..*</text>
<text x="940" y="315" class="note">1</text><text x="832" y="460" class="note">0..*</text>
<text x="72" y="468" class="note">course_id → courses.id</text>
<text x="72" y="492" class="note">ON DELETE RESTRICT</text>
<text x="950" y="365" class="note">student_id → students.id</text>
<text x="950" y="389" class="note">ON DELETE CASCADE</text>
<text x="400" y="610" class="note">UNIQUE (course_id, student_id)</text>
<text x="50" y="640" class="note">PK: primary key · FK: foreign key · UK: unique · All fields NOT NULL · bigint IDs: GENERATED ALWAYS AS IDENTITY</text>
</svg>